---
- name: "[{{ project.name }}] Compute paths"
  ansible.builtin.set_fact:
    upstream_dir: "{{ repo_root }}/{{ project.source }}"
    work_dir: "{{ work_root }}/{{ project.name }}"
    patches_dir: "{{ patches_root }}/{{ project.name }}"

- name: "[{{ project.name }}] Display version"
  ansible.builtin.debug:
    msg: "Syncing {{ project.name }} at {{ project.pin }}"

- name: "[{{ project.name }}] Ensure work_root exists"
  ansible.builtin.file:
    path: "{{ work_root }}"
    state: directory
    mode: "0755"

- name: "[{{ project.name }}] Wipe previous working directory"
  ansible.builtin.file:
    path: "{{ work_dir }}"
    state: absent

- name: "[{{ project.name }}] Create fresh working directory"
  ansible.builtin.file:
    path: "{{ work_dir }}"
    state: directory
    mode: "0755"

- name: "[{{ project.name }}] Copy submodule into working directory"
  ansible.builtin.copy:
    src: "{{ upstream_dir }}/"
    dest: "{{ work_dir }}/"
    remote_src: true
    mode: preserve

- name: "[{{ project.name }}] Remove .git from working directory"
  ansible.builtin.file:
    path: "{{ work_dir }}/.git"
    state: absent

- name: "[{{ project.name }}] Check for patches directory"
  ansible.builtin.stat:
    path: "{{ patches_dir }}"
  register: patches_dir_stat
  when: project.patches | default(false)

- name: "[{{ project.name }}] List patch files"
  ansible.builtin.find:
    paths: "{{ patches_dir }}"
    patterns: "*.patch"
    file_type: file
  register: patch_files
  when:
    - project.patches | default(false)
    - patches_dir_stat.stat.exists | default(false)

- name: "[{{ project.name }}] Apply patches"
  ansible.posix.patch:
    src: "{{ item.path }}"
    basedir: "{{ work_dir }}"
    strip: 1
  loop: "{{ patch_files.files | default([]) | sort(attribute='path') }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when:
    - project.patches | default(false)
    - patches_dir_stat.stat.exists | default(false)

- name: "[{{ project.name }}] Apply tweakcn theme"
  ansible.builtin.command:
    cmd: "npx {{ background_agents_shadcn_cli }} add -y -o {{ project.tweakcnThemeUrl | default('', true) | quote }}"
    chdir: "{{ work_dir }}/packages/web"
  changed_when: true
  when:
    - project.name == background_agents_project
    - (project.tweakcnThemeUrl | default('', true) | length) > 0

- name: "[{{ project.name }}] Confirm result"
  ansible.builtin.debug:
    msg: >-
      Synced {{ project.name }}
      {% if project.patches | default(false) and (patches_dir_stat.stat.exists | default(false)) %}
      with {{ patch_files.files | default([]) | length }} patch(es)
      {% else %}
      (no patches){% endif %}
