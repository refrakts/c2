---
- name: Load state (for env)
  ansible.builtin.set_fact:
    tf_state: "{{ lookup('file', state_json) | from_json }}"

- name: Terraform plan
  ansible.builtin.command:
    cmd: "terraform plan {{ terraform_input_args }} -var-file={{ terraform_var_file }}"
    chdir: "{{ background_agents_tf_dir }}"
  environment:
    AWS_ACCESS_KEY_ID: "{{ tf_state.access_key }}"
    AWS_SECRET_ACCESS_KEY: "{{ tf_state.secret_key }}"
    AWS_REGION: auto
  register: plan_result
  changed_when: false

- name: Show plan output
  ansible.builtin.debug:
    var: plan_result.stdout_lines
