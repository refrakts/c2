---
- name: Install npm dependencies
  ansible.builtin.command:
    cmd: "{{ background_agents_npm_install_cmd }}"
    chdir: "{{ background_agents_work_dir }}"
  changed_when: true

- name: Build background-agents packages
  ansible.builtin.command:
    cmd: "{{ item }}"
    chdir: "{{ background_agents_work_dir }}"
  loop: "{{ background_agents_build_commands }}"
  changed_when: true

- name: Sync modal-infra Python environment
  ansible.builtin.command:
    cmd: "{{ background_agents_modal_sync_cmd }}"
    chdir: "{{ background_agents_modal_dir }}"
  changed_when: true

- name: Verify worker bundles exist
  ansible.builtin.stat:
    path: "{{ background_agents_work_dir }}/packages/{{ item }}/dist/index.js"
  register: bundle_check
  failed_when: not bundle_check.stat.exists
  loop: "{{ background_agents_bundles }}"
  loop_control:
    label: "{{ item }}"

- name: Bootstrap complete
  ansible.builtin.debug:
    msg: "background-agents bootstrap finished; workers built at {{ background_agents_work_dir }}/packages/*/dist/"
