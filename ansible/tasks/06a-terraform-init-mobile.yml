---
- name: Initialize constructor-mobile Terraform
  ansible.builtin.import_tasks: 04-terraform-init-stack.yml
  vars:
    terraform_stack_name: "{{ terraform_stacks.mobile.name }}"
    terraform_stack_tf_dir: "{{ terraform_stacks.mobile.tf_dir }}"
    terraform_stack_inputs_json: "{{ terraform_stacks.mobile.inputs_json }}"
    terraform_stack_state_key: "{{ terraform_stacks.mobile.state_key }}"
    terraform_stack_extra_tfvars:
      project_root: "{{ mobile_work_dir }}"
      control_plane_url: "{{ ba_control_plane_url }}"
      ws_url: "{{ ba_ws_url }}"
