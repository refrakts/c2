---
- name: Verify mise is installed
  ansible.builtin.command: mise --version
  register: mise_version
  changed_when: false

- name: Verify mise environment is healthy
  ansible.builtin.command: mise doctor
  args:
    chdir: "{{ repo_root }}"
  register: mise_doctor
  changed_when: false

- name: Verify config.pkl exists
  ansible.builtin.stat:
    path: "{{ config_pkl }}"
  register: config_stat
  failed_when: not config_stat.stat.exists

- name: Verify config.pkl is not the unmodified example
  ansible.builtin.command: diff -q "{{ config_pkl }}" "{{ config_example_pkl }}"
  register: diff_result
  changed_when: false
  failed_when: diff_result.rc == 0

- name: Read projects list from config.pkl
  ansible.builtin.command:
    cmd: "pkl eval -f json {{ repo_root }}/config/render/projects.pkl"
  register: projects_eval
  changed_when: false

- name: Parse projects
  ansible.builtin.set_fact:
    projects: "{{ (projects_eval.stdout | from_json).projects }}"

- name: Confirm projects loaded
  ansible.builtin.debug:
    msg: "Loaded {{ projects | length }} project(s): {{ projects | map(attribute='name') | join(', ') }}"

- name: Enforce pin for each project
  ansible.builtin.include_tasks:
    file: tasks/00a-preflight-pin.yml
    apply:
      tags: [preflight]
  loop: "{{ projects }}"
  loop_control:
    loop_var: project
    label: "{{ project.name }}"
