---
- name: Verify mise is installed
  ansible.builtin.command: mise --version
  register: mise_version
  changed_when: false

- name: Verify mise environment is healthy
  ansible.builtin.command: mise doctor
  args:
    chdir: "{{ repo_root }}"
  register: mise_doctor
  changed_when: false

- name: Verify config.pkl exists
  ansible.builtin.stat:
    path: "{{ config_pkl }}"
  register: config_stat
  failed_when: not config_stat.stat.exists

- name: Verify config.pkl is not the unmodified example
  ansible.builtin.command: diff -q "{{ config_pkl }}" "{{ config_example_pkl }}"
  register: diff_result
  changed_when: false
  failed_when: diff_result.rc == 0

- name: Read pinned background-agents SHA from config.pkl
  ansible.builtin.command:
    cmd: pkl eval -x 'pins.backgroundAgents' "{{ config_pkl }}"
  register: pin_read
  changed_when: false

- name: Set pinned SHA fact
  ansible.builtin.set_fact:
    pinned_sha: "{{ pin_read.stdout | trim }}"

- name: Get current submodule SHA
  ansible.builtin.command: git -C "{{ upstream_dir }}" rev-parse HEAD
  register: current_sha
  changed_when: false

- name: Check submodule for local changes
  ansible.builtin.command: git -C "{{ upstream_dir }}" status --porcelain
  register: upstream_status
  changed_when: false

- name: Refuse to checkout if submodule has local changes and SHA differs
  ansible.builtin.fail:
    msg: |
      The submodule at {{ upstream_dir }} has local changes:

      {{ upstream_status.stdout }}

      Refusing to checkout to pinned SHA ({{ pinned_sha }}) — your changes
      would be discarded.

      Either commit/stash them, or run:
          git -C {{ upstream_dir }} checkout -- .
  when:
    - upstream_status.stdout | length > 0
    - current_sha.stdout != pinned_sha

- name: Fetch latest from origin
  ansible.builtin.command:
    cmd: git -C "{{ upstream_dir }}" fetch origin
  register: fetch_result
  changed_when: "'->' in fetch_result.stderr"
  when: current_sha.stdout != pinned_sha

- name: Checkout submodule to pinned SHA
  ansible.builtin.command:
    cmd: git -C "{{ upstream_dir }}" checkout "{{ pinned_sha }}"
  changed_when: true
  when: current_sha.stdout != pinned_sha

- name: Confirm submodule is at pinned SHA
  ansible.builtin.command: git -C "{{ upstream_dir }}" rev-parse HEAD
  register: final_sha
  changed_when: false
  failed_when: final_sha.stdout != pinned_sha

- name: Report submodule state
  ansible.builtin.debug:
    msg: >-
      Submodule at {{ pinned_sha }}
      ({{ 'already at pin' if current_sha.stdout == pinned_sha else 'updated to pin' }})
