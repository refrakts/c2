---
- name: Ensure deploy directory exists
  ansible.builtin.file:
    path: "{{ deploy_dir }}"
    state: directory
    mode: "0755"

- name: Validate config.pkl against schema
  ansible.builtin.command: pkl eval "{{ config_pkl }}"
  register: pkl_validate
  changed_when: false
  # On validation failure, Pkl exits non-zero with errors in stderr.
  # Ansible surfaces those; no special handling needed.

- name: Render Pkl -> JSON files
  ansible.builtin.command:
    cmd: "pkl eval -f json {{ item.src }} -o {{ item.dst }}"
  loop:
    - { src: "{{ repo_root }}/config/render/inputs.pkl",   dst: "{{ inputs_json }}" }
    - { src: "{{ repo_root }}/config/render/state.pkl",    dst: "{{ state_json }}" }
    - { src: "{{ repo_root }}/config/render/projects.pkl", dst: "{{ projects_json }}" }
    - { src: "{{ repo_root }}/config/render/mobile-inputs.pkl", dst: "{{ mobile_inputs_json }}" }
  loop_control:
    label: "{{ item.dst | basename }}"
  changed_when: true
