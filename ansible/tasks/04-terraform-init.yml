---
- name: Initialize background-agents Terraform
  ansible.builtin.import_tasks: 04-terraform-init-stack.yml
  vars:
    terraform_stack_name: "{{ terraform_stacks.background_agents.name }}"
    terraform_stack_tf_dir: "{{ terraform_stacks.background_agents.tf_dir }}"
    terraform_stack_inputs_json: "{{ terraform_stacks.background_agents.inputs_json }}"
    terraform_stack_state_key: "{{ terraform_stacks.background_agents.state_key }}"
    terraform_stack_extra_tfvars: {}
