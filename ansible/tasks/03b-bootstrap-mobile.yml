---
- name: Install pnpm dependencies
  ansible.builtin.command:
    cmd: "{{ mobile_install_cmd }}"
    chdir: "{{ mobile_work_dir }}"
  changed_when: true

- name: Build gateway worker
  ansible.builtin.command:
    cmd: "{{ mobile_build_cmd }}"
    chdir: "{{ mobile_work_dir }}"
  changed_when: true

- name: Verify gateway bundle exists
  ansible.builtin.stat:
    path: "{{ mobile_gateway_bundle }}"
  register: gateway_bundle
  failed_when: not gateway_bundle.stat.exists

- name: Bootstrap complete
  ansible.builtin.debug:
    msg: "constructor-mobile bootstrap finished; gateway built at {{ mobile_work_dir }}/apps/gateway/dist/"
