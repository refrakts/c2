---
- name: Deploy c2 stack
  hosts: local
  connection: local
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir }}/.."
    config_pkl: "{{ repo_root }}/config.pkl"
    config_example_pkl: "{{ repo_root }}/config.example.pkl"
    inputs_json: "{{ repo_root }}/deploy/inputs.json"
    state_json: "{{ repo_root }}/deploy/state.json"
    projects_json: "{{ repo_root }}/deploy/projects.json"
    work_root: "{{ repo_root }}/.services"
    patches_root: "{{ repo_root }}/patches"
    deploy_dir: "{{ repo_root }}/deploy"

  tasks:
    - import_tasks: tasks/00-preflight.yml # reads config.pkl, sets `projects` fact, enforces pins
      tags: [preflight]

    - import_tasks: tasks/01-render-config.yml # renders inputs.json, state.json
      tags: [render, config]

    - name: Sync each project
      ansible.builtin.include_tasks: tasks/02-sync-upstream.yml
      loop: "{{ projects }}" # fact from preflight
      loop_control:
        loop_var: project
        label: "{{ project.name }}"
      tags: [sync, upstream]

    - import_tasks: tasks/03-bootstrap-ba.yml
      tags: [bootstrap, build]

    - import_tasks: tasks/04-terraform-init.yml
      tags: [init, terraform]

    - import_tasks: tasks/05a-terraform-plan.yml
      tags: [plan, terraform]

    - import_tasks: tasks/05-terraform-apply.yml
      tags: [apply, terraform]
